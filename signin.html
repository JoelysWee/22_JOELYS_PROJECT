<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Sign In - InfinityCarrot</title>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">
      <img src="img/Project_Logo.png" alt="Brand logo">
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
         <li class="about-menu">
          <details name="site-navigation">
            <summary class="about-trigger">About</summary>
            <ul class="about-dropdown">
              <li><a href="about.html">About Us</a></li>
              <li><a href="mission.html">Our Mission</a></li>
              <li><a href="values.html">Our Values</a></li>
            </ul>
          </details>
        </li>
        <li class="products-menu">
          <details name="site-navigation">
            <summary class="products-trigger">Products</summary>
            <ul class="products-dropdown">
              <li><a href="crochet.html">Crochet Pieces</a></li>
              <li><a href="artmaterials.html">Art Materials</a></li>
              <li><a href="products.html">See All</a></li>
            </ul>
          </details>
        </li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>

      <ul class="nav-actions">
        <li><a href="" aria-label="Search">Search</a></li>
        <li><a href="signin.html">Sign in</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="signup">
      <div class="signup-card">
        <div class="signup-header">
          <h1>Login to your account</h1>
          <p>Enter your email below to login to your account</p>
        </div>

        <form class="signup-form" action="#" method="post">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <div class="field-row">
              <label for="password">Password</label>
              <a href="forgot-password.html" class="forgot-link">Forgot your password?</a>
            </div>
            <input id="password" name="password" type="password" required>
          </div>

          <button type="submit" class="btn btn-primary">Login</button>

          <button type="button" class="btn btn-outline">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path fill="currentColor" d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/>
            </svg>
            Login with Google
          </button>

          <p class="signup-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
